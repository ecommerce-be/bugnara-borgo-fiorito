# ==========================================
# Borghetto Fiorito - Backend configuration
# ==========================================
# Default profile is 'dev'. Override with SPRING_PROFILES_ACTIVE=prod
spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  application:
    name: borghetto-fiorito-api
  jpa:
    open-in-view: false   # best practice: avoid lazy-loading in the view layer

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

# Actuator: expose only what we need publicly
management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: when-authorized

# Custom application properties
app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

---
# ============== DEV PROFILE ==============
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:borghetto;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true     # available at http://localhost:8080/h2-console
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    show-sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  level:
    com.borghettofiorito: DEBUG
    org.springframework.web: INFO

---
# ============== PROD PROFILE ==============
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  level:
    root: INFO
    com.borghettofiorito: INFO
