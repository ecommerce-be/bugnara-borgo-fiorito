# ==========================================
# Bugnara Borgo Fiorito - Backend configuration
# ==========================================
spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  application:
    name: borghetto-fiorito-api
  jpa:
    open-in-view: false

server:
  port: ${PORT:${SERVER_PORT:8080}}
  error:
    include-message: always
    include-binding-errors: always

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: when-authorized

# ============== Custom app properties ==============
app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

  jwt:
    secret:         ${JWT_SECRET:}
    expiration-ms:  ${JWT_EXPIRATION_MS:86400000}
    issuer:         bugnara-borgo-fiorito

  cloudinary:
    cloud-name:    ${CLOUDINARY_CLOUD_NAME:}
    api-key:       ${CLOUDINARY_API_KEY:}
    api-secret:    ${CLOUDINARY_API_SECRET:}
    upload-preset: ${CLOUDINARY_UPLOAD_PRESET:bugnara_spots}

  resend:
    api-key:     ${RESEND_API_KEY:}
    from:        ${RESEND_FROM:Bugnara Borgo Fiorito <onboarding@resend.dev>}
    admin-inbox: ${RESEND_ADMIN_INBOX:}

---
# ============== DEV PROFILE ==============
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:borghetto;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    show-sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  level:
    com.borghettofiorito: DEBUG
    org.springframework.web: INFO
    org.springframework.security: INFO

---
# ============== PROD PROFILE (Railway / any PostgreSQL) ==============
# Railway injects the following variables for a linked Postgres service:
#   - DATABASE_URL          (jdbc-formatted, since we ask for ${{Postgres.DATABASE_URL}})
#   - PGHOST, PGPORT, PGUSER, PGPASSWORD, PGDATABASE  (alternative form)
#
# To make this work reliably we use the explicit PG* vars: they are
# always present and never need URL parsing.
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}
    username: ${PGUSER}
    password: ${PGPASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  level:
    root: INFO
    com.borghettofiorito: INFO
    org.springframework.security: WARN
